# =============================================================================
# Docker Compose - Local Test Database
# =============================================================================
#
# Postgres for `npm test`. Matches the service container CI uses, so tests
# behave the same locally and on GitHub Actions.
#
# Local dev does NOT use this — `npm run dev` pulls secrets and a database
# from the Railway `development` environment (see scripts/railway-dev.sh).
#
# Services:
#   - database: PostgreSQL 18 (port 5432)
#
# Usage:
#   docker compose up -d     # Start (required before `npm test`)
#   docker compose down      # Stop
#   docker compose down -v   # Stop and wipe the volume
#
# Credentials (local test only, never secrets):
#   - User: postgres / Password: postgres / Database: assemblyops_test
#
# =============================================================================

services:
  database:
    image: postgres:18-alpine
    container_name: assemblyops-test-db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=assemblyops_test
    # Postgres 18+ images store data in a version-specific subdirectory, so the
    # mount goes at /var/lib/postgresql — not /var/lib/postgresql/data.
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_test_data:
