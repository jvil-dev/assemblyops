# CodeRabbit configuration — on-demand second opinion for AssemblyOps.
# Codex is the primary reviewer (see the Code Review Rules in AGENTS.md).
# Auto-review is off: the free-tier hourly cap posts "review limit reached"
# on PRs it then never reviews. Request a pass with `@coderabbitai review`.
# Docs: https://docs.coderabbit.ai/reference/yaml-template
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: false
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/*.generated.*"
    - "!**/generated/**"
    - "!web/app/src/gql/**"
    - "!ios/**/*.graphql.swift"
  path_instructions:
    - path: "backend/**/*.ts"
      instructions: >
        Summarize behavior changes to the GraphQL surface. Flag missing file
        header comments and any `any` type. Leave deep correctness and
        authorization review to Codex.
    - path: "web/landing/**"
      instructions: >
        Astro static site. Flag missing file header comments. Note anything
        that would break the static build or add a runtime dependency.
    - path: "web/app/**"
      instructions: >
        Vite + React volunteer web app. Flag missing file header comments and
        any `any` type. Flag controls reachable only on hover, and touch
        targets under 44px.
    - path: "ios/**/*.swift"
      instructions: >
        SwiftUI + MVVM. Reference spec only — no active users. Flag missing
        file header comments; keep other feedback brief.

chat:
  auto_reply: true
