# CI — one always-running "CI Gate" required check for main.
# Detects which tiers a PR touches, runs only those tier jobs, and reports a
# single gate status so path-filtered tiers never deadlock a required check.
name: CI

on:
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
  changes:
    name: Detect changed tiers
    runs-on: ubuntu-latest
    permissions:
        contents: read
        pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      landing: ${{ steps.filter.outputs.landing }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/ci.yml"
            landing:
              - "web/landing/**"
              - ".github/workflows/ci.yml"
            app:
              - "web/app/**"
              - ".github/workflows/ci.yml"

  backend-lint-test:
    name: Lint & Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assemblyops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assemblyops_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/assemblyops_test
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      VOLUNTEER_TOKEN_KEY: ${{ secrets.VOLUNTEER_TOKEN_KEY }}
      CRON_SECRET: ci-test-cron-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL to be ready
        run: |
          until nc -z localhost 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready"
        working-directory: .

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test database
        run: npx prisma db push

      # Call prisma directly, as the steps above do. The npm scripts wrap
      # scripts/railway-dev.sh, which needs the Railway CLI and auth.
      - name: Seed test database
        run: npx tsx prisma/seed.ts

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 14

  backend-build:
    name: Build Docker Image
    needs: [changes, backend-lint-test]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: assemblyops-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  landing-build:
    name: Build Landing
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/landing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/landing/package-lock.json
      - run: npm ci
      - run: npm run build

  app-build:
    name: Build App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # src/gql/ is committed, so the build needs no running backend.
      - run: npm run build

  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, backend-lint-test, backend-build, landing-build, app-build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no tier job failed
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required tier job failed or was cancelled."
            exit 1
          fi
          echo "All triggered tier jobs passed (or were skipped)."